name: Call of Duty Patch Bot

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cod-patch-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python bot.py

      - name: Sauvegarder le dernier patch
        run: |
          git config user.name "COD Patch Bot"
          git config user.email "cod-patch-bot@users.noreply.github.com"

          if git diff --quiet; then
            echo "Aucune modification a enregistrer."
          else
            git add last_patch.txt
            git commit -m "Update last Warzone patch"
            git push
          fi
